name: PR

on:
  pull_request:

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: bcgov/action-builder-ghcr@v2.3.0
        with:
          package: sync
          tag: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('sync/')

  deploy:
    name: Deploy (${{ github.event.number }})
    needs: [build]
    secrets: inherit
    uses: ./.github/workflows/.deploy.yml
    with:
      run-etl: true
      test-mode: true
      # target: ${{ github.event.number }}
      target: test
      triggers: ('sync/')

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: PR Results
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
