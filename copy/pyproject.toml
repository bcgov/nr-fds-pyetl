[project]
name = "copy"
version = "0.1.0"
description = "Copy a single seedlot (and all child tables) from on-prem Oracle (THE) to OpenShift Postgres (spar)"
readme = "README.md"
license = {text = "Apache License 2.0"}
requires-python = ">=3.11"
dependencies = [
    "oracledb>=3.1.1",
    "psycopg2>=2.9.10",
]
package-mode = false

[tool.ruff]
line-length = 80

[tool.black]
line-length = 80

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ruff>=0.8.0",
]
